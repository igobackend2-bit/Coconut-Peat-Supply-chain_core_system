# MQTT credentials are read from the Secret `mqtt-credentials` — never commit them. Create it once per cluster:
#   kubectl create secret generic mqtt-credentials \
#     --from-literal=broker='ssl://<host>:8883' --from-literal=username='<user>' --from-literal=password='<password>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grading-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grading-plugin
  template:
    metadata:
      labels:
        app: grading-plugin
    spec:
      containers:
        - name: grading-plugin
          image: harith2001/coco-grading:latest
          ports:
            - containerPort: 50052
          env:
            - name: MQTT_BROKER
              valueFrom:
                secretKeyRef: { name: mqtt-credentials, key: broker }
            - name: CLIENT_ID
              value: "GradingPluginSubscriber"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef: { name: mqtt-credentials, key: username }
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mqtt-credentials, key: password }

---
apiVersion: v1
kind: Service
metadata:
  name: grading-plugin-service
spec:
  selector:
    app: grading-plugin
  ports:
    - protocol: TCP
      port: 50052
      targetPort: 50052
  type: ClusterIP
