services:
  core:
    build:
      context: .
      dockerfile: core.dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/coco-core
    container_name: Core
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?Set MQTT_BROKER in .env}
      - CLIENT_ID=CoreClient
      - MQTT_USERNAME=${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
    ports:
      - "50051:50051"

  grading:
    build:
      context: ./plugins/grading
      dockerfile: grading.dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/coco-grading
    container_name: Grading
    volumes:
      - ./plugins/grading:/app
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?Set MQTT_BROKER in .env}
      - CLIENT_ID=GradingPluginSubscriber
      - MQTT_USERNAME=${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
    ports:
      - "50052:50052" 

  cutting:
    build:
      context: ./plugins/cutting
      dockerfile: cutting.dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/coco-cutting
    container_name: Cutting
    volumes:
      - ./plugins/cutting:/app
    ports:
      - "50053:50053"